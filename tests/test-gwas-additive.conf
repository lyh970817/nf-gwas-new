/*
========================================================================================
    Nextflow config file for running tests
========================================================================================
*/

params {

  project                       = 'test-gwas-additive'
  genotypes_prediction          = "$projectDir/tests/input/example.{bim,bed,fam}"
  genotypes_association         = "$projectDir/tests/input/chr01.vcf.gz"
  genotypes_build               = 'hg19'
  genotypes_association_format  = 'vcf'
  phenotypes_dir               = "$projectDir/tests/input/phenotypes/basic"
  regenie_test                  = 'additive'
  annotation_min_log10p         = 2
}

process {
    withName: '.*' {
        cpus = 1
        memory = 1.GB
    }
}
