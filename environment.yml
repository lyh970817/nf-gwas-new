# You can use this file to create a conda environment for this pipeline:
#   conda env create -f environment.yml
name: nf-gwas
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base>=4.3
  - r-data.table
  - r-r.utils
  - r-httr
  - r-jsonlite
  - r-curl
  # MungeSumstats and dependencies (pre-compiled from bioconda)
  - bioconductor-mungesumstats
  # Other tools (relaxed version constraints to avoid conflicts)
  - plink2
  - plink
  - gcta
  - bolt-lmm
  - openjdk
  - unzip
  - bedtools
  - htslib
  - csvtk
  - curl